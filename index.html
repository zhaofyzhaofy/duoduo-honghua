<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>朵朵红花</title>
  <meta name="theme-color" content="#FF6B9D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="朵朵红花">
  <link rel="manifest" id="manifestLink">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config={theme:{extend:{colors:{
      sky:'#E8F4FD',candy:'#FF6B9D',sunny:'#FFB347',leafy:'#6BCB77',
      ocean:'#4FC3F7',berry:'#9C6ADE',peach:'#FFE0EC',butter:'#FFF9E0',
      minty:'#E0F7E9',lavender:'#F0E4FF'
    }}}
  </script>
  <style>
    :root{
      --bg:#E8F4FD;--card:#FFFFFF;--primary:#FF6B9D;--primary-light:#FFE0EC;
      --secondary:#FFB347;--accent:#6BCB77;--blue:#4FC3F7;--purple:#9C6ADE;
      --text:#4A3728;--muted:#B0997E;--border:#FFE0EC;--shadow:rgba(255,107,157,.2)
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'ZCOOL KuaiLe',cursive,system-ui;
      background:linear-gradient(180deg,#E8F4FD 0%,#FFF9E0 50%,#FFE0EC 100%);
      color:var(--text);min-height:100vh;min-height:100dvh;
      overflow-x:hidden;-webkit-tap-highlight-color:transparent;
    }

    /* 背景装饰：云朵和星星 */
    .cloud{position:fixed;pointer-events:none;z-index:0;opacity:.45}
    .cloud svg{filter:drop-shadow(0 2px 4px rgba(0,0,0,.04))}
    @keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(30px)}}
    .cloud{animation:drift 8s ease-in-out alternate}

    .star-deco{position:fixed;pointer-events:none;z-index:0}
    @keyframes twinkle{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:.7;transform:scale(1.1)}}
    .star-deco{animation:twinkle 3s ease-in-out infinite}

    /* 进度环 */
    .ring-progress{transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1);transform:rotate(-90deg);transform-origin:50% 50%}

    /* 弹出 */
    @keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
    .dot-earned{animation:pop .45s ease-out}

    /* 摇晃 */
    @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}

    /* 花瓣飘落 */
    .petal{position:fixed;pointer-events:none;z-index:1000;animation:pFall linear forwards}
    @keyframes pFall{0%{opacity:1;transform:translateY(0) rotate(0) scale(1)}100%{opacity:0;transform:translateY(100vh) rotate(720deg) scale(.2)}}

    /* 彩纸 */
    .cft{position:fixed;pointer-events:none;z-index:1001;animation:cFall linear forwards}
    @keyframes cFall{0%{opacity:1;transform:translateY(-10vh) rotate(0)}100%{opacity:0;transform:translateY(110vh) rotate(1080deg)}}

    /* 模态框 */
    .modal-bg{transition:opacity .25s ease}.modal-bg.hide{opacity:0;pointer-events:none}
    .modal-box{transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .25s ease}.modal-bg.hide .modal-box{transform:translateY(40px) scale(.95);opacity:0}

    /* 按钮 */
    .btn-main{transition:transform .15s}.btn-main:active{transform:scale(.93)}

    /* 孩子卡片 */
    .member-card{transition:all .25s ease;cursor:pointer;border:3px solid transparent}
    .member-card.on{transform:translateY(-4px);box-shadow:0 8px 24px var(--shadow)}

    /* 快捷标签 */
    .qtag{transition:all .15s;cursor:pointer}.qtag:active{transform:scale(.92)}

    /* 记录项 */
    .rec-item{transition:transform .2s}

    /* Tab */
    .tbtn{transition:all .2s}.tbtn.on{color:var(--primary);transform:scale(1.05)}

    /* Toast */
    .toast-in{animation:tIn .35s ease,tOut .35s ease 2.2s forwards}
    @keyframes tIn{from{transform:translateY(-16px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes tOut{from{opacity:1}to{opacity:0;transform:translateY(-10px)}}

    /* 浮动 */
    @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

    /* 呼吸光 */
    @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,107,157,.35)}50%{box-shadow:0 0 0 14px rgba(255,107,157,0)}}

    /* 旋转 */
    @keyframes spin-slow{from{transform:rotate(0)}to{transform:rotate(360deg)}}

    /* 滚动条 */
    ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--primary-light);border-radius:3px}

    /* 安全区域 */
    body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

    /* 安装横幅 */
    .install-bar{animation:slideU .4s ease}
    @keyframes slideU{from{transform:translateY(100%)}to{transform:translateY(0)}}

    /* 大圆角卡片 */
    .card-cute{border-radius:20px;border:3px solid var(--border);background:var(--card);box-shadow:0 4px 16px rgba(255,107,157,.08)}

    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body class="relative">

  <!-- 背景装饰：云朵 -->
  <div class="cloud" style="top:20px;left:5%">
    <svg width="100" height="50" viewBox="0 0 100 50"><ellipse cx="50" cy="35" rx="40" ry="15" fill="white"/><ellipse cx="35" cy="25" rx="22" ry="18" fill="white"/><ellipse cx="60" cy="22" rx="25" ry="20" fill="white"/><ellipse cx="75" cy="30" rx="18" ry="14" fill="white"/></svg>
  </div>
  <div class="cloud" style="top:60px;right:8%;animation-delay:-3s;animation-duration:10s">
    <svg width="80" height="40" viewBox="0 0 100 50"><ellipse cx="50" cy="35" rx="40" ry="15" fill="white"/><ellipse cx="35" cy="25" rx="22" ry="18" fill="white"/><ellipse cx="60" cy="22" rx="25" ry="20" fill="white"/></svg>
  </div>
  <div class="cloud" style="top:160px;left:60%;animation-delay:-5s;animation-duration:12s">
    <svg width="60" height="30" viewBox="0 0 100 50"><ellipse cx="50" cy="35" rx="40" ry="15" fill="white"/><ellipse cx="40" cy="25" rx="22" ry="18" fill="white"/><ellipse cx="60" cy="22" rx="25" ry="20" fill="white"/></svg>
  </div>

  <!-- 背景装饰：星星 -->
  <div class="star-deco" style="top:100px;left:15%;animation-delay:0s">
    <svg width="20" height="20" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 16,14 18,22 12,17 6,22 8,14 2,9 9,9" fill="#FFB347"/></svg>
  </div>
  <div class="star-deco" style="top:200px;right:12%;animation-delay:-1.5s">
    <svg width="16" height="16" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 16,14 18,22 12,17 6,22 8,14 2,9 9,9" fill="#FF6B9D"/></svg>
  </div>
  <div class="star-deco" style="top:320px;left:8%;animation-delay:-2.5s">
    <svg width="14" height="14" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 16,14 18,22 12,17 6,22 8,14 2,9 9,9" fill="#4FC3F7"/></svg>
  </div>
  <div class="star-deco" style="top:450px;right:18%;animation-delay:-0.8s">
    <svg width="18" height="18" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 16,14 18,22 12,17 6,22 8,14 2,9 9,9" fill="#6BCB77"/></svg>
  </div>
  <div class="star-deco" style="top:580px;left:25%;animation-delay:-2s">
    <svg width="12" height="12" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 16,14 18,22 12,17 6,22 8,14 2,9 9,9" fill="#9C6ADE"/></svg>
  </div>

  <!-- Toast -->
  <div id="toasts" class="fixed top-4 left-1/2 -translate-x-1/2 z-[1100] flex flex-col gap-2 pointer-events-none" style="margin-top:env(safe-area-inset-top)"></div>
  <!-- 确认弹窗 -->
  <div id="confirmWrap"></div>

  <!-- 主应用 -->
  <div id="app" class="relative z-10 max-w-lg mx-auto min-h-screen flex flex-col" style="min-height:100dvh;padding-bottom:calc(5.5rem + env(safe-area-inset-bottom))">
    <header class="flex items-center justify-between px-5 pt-6 pb-1">
      <h1 class="text-3xl tracking-wide" style="color:var(--primary)">
        <svg width="32" height="32" viewBox="0 0 32 32" class="inline -mt-1 mr-1"><g transform="translate(16,14)"><ellipse rx="4" ry="7" cy="-6" fill="#FF6B9D" transform="rotate(0)"/><ellipse rx="4" ry="7" cy="-6" fill="#FF8DB5" transform="rotate(72)"/><ellipse rx="4" ry="7" cy="-6" fill="#FF6B9D" transform="rotate(144)"/><ellipse rx="4" ry="7" cy="-6" fill="#FF8DB5" transform="rotate(216)"/><ellipse rx="4" ry="7" cy="-6" fill="#FF6B9D" transform="rotate(288)"/><circle r="5" fill="#FFD700"/><circle r="3" fill="#FFA000" opacity=".5"/></g><rect x="14.5" y="22" width="3" height="8" rx="1.5" fill="#6BCB77"/></svg>
        朵朵红花
      </h1>
      <button onclick="openSettings()" class="w-11 h-11 rounded-2xl flex items-center justify-center bg-white/60 hover:bg-white transition-colors" aria-label="设置">
        <i class="fa-solid fa-gear text-lg" style="color:var(--muted)"></i>
      </button>
    </header>
    <div id="memberBar" class="flex gap-3 px-5 py-3 overflow-x-auto" style="scrollbar-width:none;-ms-overflow-style:none"></div>
    <main id="mainArea" class="flex-1 overflow-y-auto px-5 pb-4"></main>
  </div>

  <!-- 底部Tab -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-white/95 backdrop-blur-xl border-t-3" style="border-top:3px solid var(--primary-light);padding-bottom:env(safe-area-inset-bottom)">
    <div class="max-w-lg mx-auto flex">
      <button class="tbtn on flex-1 flex flex-col items-center py-3 gap-1" data-t="garden" onclick="goTab('garden')">
        <div class="w-10 h-10 rounded-2xl flex items-center justify-center" style="background:var(--primary-light)"><i class="fa-solid fa-sun text-lg" style="color:var(--primary)"></i></div>
        <span class="text-xs font-bold">花园</span>
      </button>
      <button class="tbtn flex-1 flex flex-col items-center py-3 gap-1" data-t="medals" onclick="goTab('medals')">
        <div class="w-10 h-10 rounded-2xl flex items-center justify-center bg-gray-100"><i class="fa-solid fa-medal text-lg" style="color:var(--muted)"></i></div>
        <span class="text-xs">勋章</span>
      </button>
      <button class="tbtn flex-1 flex flex-col items-center py-3 gap-1" data-t="records" onclick="goTab('records')">
        <div class="w-10 h-10 rounded-2xl flex items-center justify-center bg-gray-100"><i class="fa-solid fa-clock-rotate-left text-lg" style="color:var(--muted)"></i></div>
        <span class="text-xs">记录</span>
      </button>
      <button class="tbtn flex-1 flex flex-col items-center py-3 gap-1" data-t="wishes" onclick="goTab('wishes')">
        <div class="w-10 h-10 rounded-2xl flex items-center justify-center bg-gray-100"><i class="fa-solid fa-gift text-lg" style="color:var(--muted)"></i></div>
        <span class="text-xs">心愿</span>
      </button>
    </div>
  </nav>

  <!-- PWA 安装横幅 -->
  <div id="installBar" class="install-bar fixed bottom-20 left-3 right-3 z-40 px-4 py-3 rounded-2xl hidden" style="background:linear-gradient(135deg,var(--primary),#FF8DB5);padding-bottom:calc(0.75rem + env(safe-area-inset-bottom))">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center bg-white/25 shrink-0"><i class="fa-solid fa-download text-white text-lg"></i></div>
      <div class="flex-1 min-w-0"><p class="text-white text-sm font-bold">添加到主屏幕</p><p class="text-white/80 text-xs">像App一样全屏使用</p></div>
      <button onclick="installPWA()" class="px-4 py-2 rounded-full bg-white text-sm font-bold shrink-0" style="color:var(--primary)">安装</button>
      <button onclick="dismissInstall()" class="text-white/60 hover:text-white shrink-0"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </div>

  <!-- 模态框：给小红花 -->
  <div id="mGive" class="modal-bg hide fixed inset-0 z-[100] flex items-end justify-center bg-black/30" onclick="if(event.target===this)closeM('mGive')">
    <div class="modal-box bg-white rounded-t-[28px] w-full max-w-lg p-6 pb-10 max-h-[85vh] overflow-y-auto" style="border-top:4px solid var(--primary)">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-2xl" style="color:var(--primary)">
          <i class="fa-solid fa-heart mr-1"></i>给小红花
        </h2>
        <button onclick="closeM('mGive')" class="w-9 h-9 rounded-xl flex items-center justify-center hover:bg-gray-100"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <p class="text-sm mb-2" style="color:var(--muted)">选择类别：</p>
      <div id="dimBtns" class="flex gap-2 mb-4 flex-wrap"></div>
      <p class="text-sm mb-2" style="color:var(--muted)">快速选择：</p>
      <div id="qTags" class="flex flex-wrap gap-2 mb-4"></div>
      <div id="addTagArea" class="mb-5 hidden">
        <div class="flex gap-2">
          <input id="newTagInput" type="text" maxlength="10" placeholder="输入新标签名" class="flex-1 px-4 py-2.5 rounded-xl border-3 text-sm" style="border:3px solid var(--border)" onkeydown="if(event.key==='Enter')doAddTag()">
          <button onclick="doAddTag()" class="px-4 py-2.5 rounded-xl text-white text-sm" style="background:var(--primary)">添加</button>
          <button onclick="hideAddTag()" class="px-3 py-2.5 rounded-xl text-sm" style="background:var(--primary-light);color:var(--primary)">取消</button>
        </div>
      </div>
      <label class="text-sm block mb-1.5" style="color:var(--muted)">或自定义内容：</label>
      <input id="giveInput" type="text" maxlength="50" placeholder="给 TA 记下什么好事呀？" class="w-full px-4 py-3.5 rounded-xl border-3 text-lg mb-5" style="border:3px solid var(--border)" onkeydown="if(event.key==='Enter')doGive()">
      <button onclick="doGive()" class="btn-main w-full py-4 rounded-2xl text-white text-xl" style="background:linear-gradient(135deg,var(--primary),#FF8DB5);box-shadow:0 6px 20px var(--shadow)">
        <i class="fa-solid fa-heart mr-2"></i>确认给花
      </button>
    </div>
  </div>

  <!-- 模态框：扣小红花 -->
  <div id="mDeduct" class="modal-bg hide fixed inset-0 z-[100] flex items-end justify-center bg-black/30" onclick="if(event.target===this)closeM('mDeduct')">
    <div class="modal-box bg-white rounded-t-[28px] w-full max-w-lg p-6 pb-10 max-h-[85vh] overflow-y-auto" style="border-top:4px solid #E85D5D">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-2xl" style="color:#E85D5D">
          <i class="fa-solid fa-circle-minus mr-1"></i>扣小红花
        </h2>
        <button onclick="closeM('mDeduct')" class="w-9 h-9 rounded-xl flex items-center justify-center hover:bg-gray-100"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <p class="text-sm mb-2" style="color:var(--muted)">选择类别：</p>
      <div id="dimBtnsDeduct" class="flex gap-2 mb-4 flex-wrap"></div>
      <p class="text-sm mb-2" style="color:var(--muted)">快速选择：</p>
      <div id="qTagsDeduct" class="flex flex-wrap gap-2 mb-4"></div>
      <div id="addTagAreaDeduct" class="mb-5 hidden">
        <div class="flex gap-2">
          <input id="newTagInputDeduct" type="text" maxlength="10" placeholder="输入新标签名" class="flex-1 px-4 py-2.5 rounded-xl border-3 text-sm" style="border:3px solid #FFD4D4" onkeydown="if(event.key==='Enter')doAddTagDeduct()">
          <button onclick="doAddTagDeduct()" class="px-4 py-2.5 rounded-xl text-white text-sm" style="background:#E85D5D">添加</button>
          <button onclick="hideAddTagDeduct()" class="px-3 py-2.5 rounded-xl text-sm" style="background:#FFE0E0;color:#E85D5D">取消</button>
        </div>
      </div>
      <label class="text-sm block mb-1.5" style="color:var(--muted)">或自定义原因：</label>
      <input id="deductInput" type="text" maxlength="50" placeholder="为什么扣这朵花？" class="w-full px-4 py-3.5 rounded-xl border-3 text-lg mb-2" style="border:3px solid #FFD4D4" onkeydown="if(event.key==='Enter')doDeduct()">
      <p class="text-xs mb-3" style="color:var(--muted)">提示：花朵会扣到 0 为止，不能为负数</p>
      <button onclick="doDeduct()" class="btn-main w-full py-4 rounded-2xl text-white text-xl" style="background:linear-gradient(135deg,#E85D5D,#FF8E72);box-shadow:0 6px 20px rgba(232,93,93,.25)">
        <i class="fa-solid fa-circle-minus mr-2"></i>确认扣花
      </button>
    </div>
  </div>

  <!-- 模态框：添加心愿 -->
  <div id="mWish" class="modal-bg hide fixed inset-0 z-[100] flex items-end justify-center bg-black/30" onclick="if(event.target===this)closeM('mWish')">
    <div class="modal-box bg-white rounded-t-[28px] w-full max-w-lg p-6 pb-10" style="border-top:4px solid var(--secondary)">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-2xl" style="color:var(--secondary)"><i class="fa-solid fa-star mr-1"></i>添加心愿</h2>
        <button onclick="closeM('mWish')" class="w-9 h-9 rounded-xl flex items-center justify-center hover:bg-gray-100"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <input id="wishInput" type="text" maxlength="30" placeholder="想要什么礼物呢？" class="w-full px-4 py-3.5 rounded-xl border-3 text-lg mb-5" style="border:3px solid #FFE5B4" onkeydown="if(event.key==='Enter')doWish()">
      <button onclick="doWish()" class="btn-main w-full py-4 rounded-2xl text-white text-xl" style="background:linear-gradient(135deg,var(--secondary),#FFD180);box-shadow:0 6px 20px rgba(255,179,71,.25)">
        <i class="fa-solid fa-star mr-2"></i>添加到心愿单
      </button>
    </div>
  </div>

  <!-- 模态框：兑换 -->
  <div id="mRedeem" class="modal-bg hide fixed inset-0 z-[100] flex items-end justify-center bg-black/30" onclick="if(event.target===this)closeM('mRedeem')">
    <div class="modal-box bg-white rounded-t-[28px] w-full max-w-lg p-6 pb-10 max-h-[80vh] overflow-y-auto" style="border-top:4px solid var(--accent)">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-2xl" style="color:var(--accent)"><i class="fa-solid fa-gift mr-1"></i>兑换礼物</h2>
        <button onclick="closeM('mRedeem')" class="w-9 h-9 rounded-xl flex items-center justify-center hover:bg-gray-100"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <p class="text-sm mb-2" style="color:var(--muted)">从心愿单选择，或自定义：</p>
      <div id="redeemList" class="flex flex-col gap-2 mb-4"></div>
      <input id="redeemInput" type="text" maxlength="30" placeholder="自定义礼物名称" class="w-full px-4 py-3.5 rounded-xl border-3 text-lg mb-5" style="border:3px solid #C8E6C9" onkeydown="if(event.key==='Enter')doRedeem()">
      <button onclick="doRedeem()" class="btn-main w-full py-4 rounded-2xl text-white text-xl" style="background:linear-gradient(135deg,var(--accent),#A8E6CF);box-shadow:0 6px 20px rgba(107,203,119,.25)">
        <i class="fa-solid fa-wand-magic-sparkles mr-2"></i>确认兑换
      </button>
    </div>
  </div>

  <!-- 模态框：设置 -->
  <div id="mSet" class="modal-bg hide fixed inset-0 z-[100] flex items-start justify-center bg-black/30 overflow-y-auto" onclick="if(event.target===this)closeM('mSet')">
    <div class="modal-box bg-white rounded-[28px] w-full max-w-md p-6 my-6">
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-2xl"><i class="fa-solid fa-gear mr-1" style="color:var(--muted)"></i>设置</h2>
        <button onclick="closeM('mSet')" class="w-9 h-9 rounded-xl flex items-center justify-center hover:bg-gray-100"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div id="setBody"></div>
    </div>
  </div>

  <!-- 模态框：勋章解锁 -->
  <div id="mMedalUnlock" class="modal-bg hide fixed inset-0 z-[200] flex items-center justify-center bg-black/40 px-6">
    <div class="modal-box bg-white rounded-[28px] p-8 w-full max-w-sm text-center">
      <p class="text-base mb-2" style="color:var(--secondary)">恭喜获得新勋章！</p>
      <div id="medalUnlockIcon" class="text-7xl my-4" style="animation:bounceIn .6s ease"></div>
      <h3 id="medalUnlockName" class="text-2xl mb-2" style="color:var(--primary)"></h3>
      <p id="medalUnlockDesc" class="text-base mb-6" style="color:var(--muted)"></p>
      <button onclick="closeM('mMedalUnlock')" class="btn-main w-full py-4 rounded-2xl text-white text-xl" style="background:linear-gradient(135deg,var(--secondary),#FFD180)">太棒了！</button>
    </div>
  </div>

// ==================== PWA 初始化 ====================
function genAppIcon(size){
  const c=document.createElement('canvas');c.width=c.height=size;
  const ctx=c.getContext('2d');
  // 圆角背景
  const r=size*.18;
  ctx.beginPath();ctx.moveTo(r,0);ctx.lineTo(size-r,0);ctx.quadraticCurveTo(size,0,size,r);
  ctx.lineTo(size,size-r);ctx.quadraticCurveTo(size,size,size-r,size);
  ctx.lineTo(r,size);ctx.quadraticCurveTo(0,size,0,size-r);
  ctx.lineTo(0,r);ctx.quadraticCurveTo(0,0,r,0);ctx.closePath();
  ctx.fillStyle='#E8F4FD';ctx.fill();ctx.clip();
  // 花
  const cx=size/2,cy=size*.4;
  const cols=['#FF6B9D','#FF8DB5','#FF6B9D','#FF8DB5','#FF6B9D'];
  for(let i=0;i<5;i++){
    const a=(i*72-90)*Math.PI/180;
    ctx.fillStyle=cols[i];ctx.beginPath();
    ctx.ellipse(cx+Math.cos(a)*size*.13,cy+Math.sin(a)*size*.13,size*.11,size*.07,a+Math.PI/2,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(cx,cy,size*.08,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#FFA000';ctx.beginPath();ctx.arc(cx,cy,size*.045,0,Math.PI*2);ctx.fill();
  // 茎
  ctx.strokeStyle='#6BCB77';ctx.lineWidth=size*.03;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx,cy+size*.13);ctx.quadraticCurveTo(cx+size*.05,size*.7,cx-size*.015,size*.88);ctx.stroke();
  return c.toDataURL('image/png');
}

// 合并函数：保留用户已有自定义 + 补齐缺失的预设标签
function buildTagsWithRoleDefaults(existing){
  const arr=Array.isArray(existing)?existing:[];
  const defaults=[
    ...DEFAULT_TAGS_BY_ROLE.dad,
    ...DEFAULT_TAGS_BY_ROLE.mom,
    ...DEFAULT_TAGS_BY_ROLE.kid
  ];
  const existingNames=new Set(arr.map(t=>t.name));
  const merged=[...arr];
  defaults.forEach(dt=>{
    if(!existingNames.has(dt.name)){
      merged.push({...dt});
    }
  });
  return merged;
}

// 给某个角色补默认颜色时避开已被占用的颜色
function pickFreeColor(members,preferred){
  const used=new Set(members.map(m=>(m.color||'').toLowerCase()));
  if(!used.has(String(preferred).toLowerCase()))return preferred;
  const pool=['#2563EB','#EC4899','#F97316','#14B8A6','#8B5CF6','#FACC15','#06B6D4','#EF4444'];
  for(const c of pool)if(!used.has(c.toLowerCase()))return c;
  return preferred;
}

// 成员颜色去重：第一次出现的色保留；后续重复色从调色板里挑未占用的替换。
// 用于升级场景：v6 早期默认爸爸蓝(4FC3F7)可能与某些小宝色撞，统一重整。
function dedupeMemberColors(members){
  const pool=['#2563EB','#EC4899','#F97316','#14B8A6','#8B5CF6','#FACC15','#06B6D4','#EF4444','#4FC3F7','#FFB347','#9C6ADE','#FFD180','#FF6B9D','#5EEAD4'];
  const seen=new Set();
  for(const m of members){
    const lc=(m.color||'').toLowerCase();
    if(seen.has(lc)){
      const free=pool.find(p=>!seen.has(p.toLowerCase()));
      if(free){m.color=free;seen.add(free.toLowerCase());}
    }else{
      seen.add(lc);
    }
  }
}

// 把 kid 角色中"蓝色系"成员换为绿色/橙色，避免视觉上和爸爸蓝色撞系
// 蓝色系识别：#2563EB、#1D4ED8、#4FC3F7、#3B82F6、#0EA5E9、#06B6D4 等
function deblueKidMembers(members){
  const blueRegex=/^#(2563|1d4e|3b82|4fc3|60a5|0ea5|06b6|1d4|2563eb|3b82f6|4fc3f7|1d4ed8|06b6d4)/i;
  for(const m of members){
    if(m.role!=='kid')continue;
    if(!blueRegex.test((m.color||'').toLowerCase()))continue;
    const used=new Set(members.map(x=>(x.color||'').toLowerCase()));
    const alt=['#10B981','#F59E0B','#8B5CF6','#EC4899','#FACC15','#EF4444','#14B8A6'];
    const free=alt.find(c=>!used.has(c.toLowerCase()));
    if(free){m.color=free;}
  }
}

// 把"名字仍是默认名 + 颜色仍是历史默认色"的成员，统一升到当前 buildDefaultMembers 的默认色。
// 这样老版本升级后，爸爸/妈妈/大宝/小宝的颜色会自动对齐到新方案，不依赖手动改色。
// 已被用户手动改过（颜色不在历史默认色列表）的成员不会被覆盖。
function migrateDefaultColors(members){
  const newByName={
    '爸爸':'#6BCB77',
    '妈妈':'#FFB347',
    '大宝':'#FF6B9D',
    '小宝':'#4FC3F7'
  };
  const legacyByRole={
    dad:['#1d4ed8','#4fc3f7','#2563eb','#3b82f6','#60a5fa','#1e40af','#0ea5e9','#06b6d4'],
    mom:['#ec4899','#f472b6','#db2777','#be185d','#f9a8d4','#ff6b6b'],
    kid:['#f59e0b','#10b981','#5eead4','#ffb347','#fbbf24','#facc15','#fcd34d']
  };
  for(const m of members){
    const name=(m.name||'').trim();
    const target=newByName[name];
    if(!target)continue;
    const legacy=(legacyByRole[m.role]||[]).map(c=>c.toLowerCase());
    const lc=(m.color||'').toLowerCase();
    if(legacy.includes(lc) && lc!==target.toLowerCase()){
      m.color=target;
    }
  }
}

// 自动迁移老数据 + 补齐爸爸、妈妈
function migrateData(d){
  // v5 之前是 children → 改为 members，并把 records/wishes 里的 childId 升级为 memberId
  if(!d.members && d.children){
    d.members = d.children.map(c => ({
      id:c.id, name:c.name||'宝宝', flowers:c.flowers||0,
      color:c.color||'#FF6B9D', emoji:c.emoji||'🧒',
      avatar:c.avatar||'', role:'kid'
    }));
    delete d.children;
  }
  // 兼容：旧 records / wishes 里如果还存在 childId 字段，统一改为 memberId
  if(Array.isArray(d.records)){
    d.records.forEach(r => {
      if(r.childId !== undefined && r.memberId === undefined){
        r.memberId = r.childId;
        delete r.childId;
      }
    });
  }
  if(Array.isArray(d.wishes)){
    d.wishes.forEach(w => {
      if(w.childId !== undefined && w.memberId === undefined){
        w.memberId = w.childId;
        delete w.childId;
      }
    });
  }
  // 老自定义标签缺 role 字段，默认为 kid（历史都是孩子向）
  if(Array.isArray(d.tags)){
    d.tags.forEach(t=>{
      if(typeof t==='object' && t.role===undefined){
        t.role='kid';
      }
    });
  }
  if(!d.members) d.members = buildDefaultMembers();

  // 确保每个成员都有 role 和必要字段
  d.members.forEach(m => {
    if(!m.role) m.role = 'kid';
    if(typeof m.flowers !== 'number') m.flowers = 0;
    if(!m.color) m.color = ROLES[m.role]?.defaultColor || '#FF6B9D';
    if(!m.emoji) m.emoji = ROLES[m.role]?.emoji || '😊';
    if(!m.name) m.name = ROLES[m.role]?.name || '家人';
  });

  // 补齐爸爸、妈妈角色（如果还没有的话）
  const hasRole = (role) => d.members.some(m => m.role === role);
  if(!hasRole('dad') || !hasRole('mom')){
    const newId = d.members.reduce((max, m) => Math.max(max, m.id||0), 0) + 1;
    if(!hasRole('dad')){
      const dadColor = pickFreeColor(d.members, '#2563EB');
      d.members.unshift({id:newId, name:'爸爸', flowers:0, color:dadColor, emoji:'👨', avatar:'', role:'dad'});
    }
    if(!hasRole('mom')){
      const dadIdx = d.members.findIndex(m => m.role==='dad');
      const insertAt = dadIdx >= 0 ? dadIdx + 1 : d.members.length;
      const momColor = pickFreeColor(d.members, '#EC4899');
      d.members.splice(insertAt, 0, {id:newId+1, name:'妈妈', flowers:0, color:momColor, emoji:'👩', avatar:'', role:'mom'});
    }
  }
  // 颜色去重：保留第一次出现的色，重复色替换为调色板中未占用的色
  // 解决 v6 早期版本里 dad=#4FC3F7 与某些小宝色撞车的情况
  dedupeMemberColors(d.members);
  // kid 角色中的蓝色系自动换成绿色/橙色，避免视觉上与爸爸蓝撞系
  deblueKidMembers(d.members);
  // 名字仍是默认名 + 颜色仍是历史默认色 → 升到 buildDefaultMembers 的当前默认色
  // （只动"看起来还没手动改过"的成员，用户手动选过的色不会被覆盖）
  migrateDefaultColors(d.members);
  return d;
}

function load(){
  try{
    const s=localStorage.getItem(STORE_KEY);
    if(s){
      const d=JSON.parse(s);
      if(d.members||d.children){
        if(d.tags&&d.tags.length&&typeof d.tags[0]==='string'){
          // 老版本：字符串数组，按名字映射 dim 并补 role:'kid'
          const map={};
          [...DEFAULT_TAGS_KID,...DEFAULT_TAGS_DAD,...DEFAULT_TAGS_MOM].forEach(t=>{map[t.name]=t.dim});
          d.tags=d.tags.map(t=>({name:t,dim:map[t]||'self',role:'kid'}));
        }
        if(!d.tags)d.tags=[];
        // 补齐缺失的角色预设标签
        d.tags = buildTagsWithRoleDefaults(d.tags);
        if(!d.unlockedMedals)d.unlockedMedals={};
        const upgraded = migrateData(d);
        // 持久化：任何升级（包括颜色去重）的结果都回写，避免下次再修
        try{localStorage.setItem(STORE_KEY,JSON.stringify(upgraded))}catch(e){}
        return upgraded;
      }
    }
    // 读取老版本 key 做一次性迁移（v5 -> v6）
    const oldKeys=['duoduo_honghua_v5','duoduo_honghua_v4','duoduo_honghua_v3'];
    for(const k of oldKeys){
      const old=localStorage.getItem(k);
      if(old){
        try{
          const od=JSON.parse(old);
          if(od.children||od.members){
            if(typeof od.tags?.[0]==='string'){
              const map={};DEFAULT_TAGS_KID.forEach(t=>{map[t.name]=t.dim});
              od.tags=od.tags.map(t=>({name:t,dim:map[t]||'self',role:'kid'}));
            }
            if(od.tags) od.tags = buildTagsWithRoleDefaults(od.tags);
            const upgraded=migrateData(od);
            localStorage.setItem(STORE_KEY,JSON.stringify(upgraded));
            return upgraded;
          }
        }catch(e){}
        // 已被读过一次，留作下回迁移检测
        break;
      }
    }
  }catch(e){}
  // 清理老 key（仅在已经处理过迁移的情况下）
  try{['duoduo_honghua_v5','duoduo_honghua_v4','duoduo_honghua_v3'].forEach(k=>localStorage.removeItem(k))}catch(e){}
  return defaults();
}

// ==================== 生成小花SVG ====================
function mkFlower(sz,color,on){
  let p='';
  const colors=[color,lighten(color),color,lighten(color),color];
  for(let i=0;i<5;i++){
    if(on){
      p+=`<g transform="rotate(${i*72})"><ellipse rx="4" ry="7" cy="-6.5" fill="${colors[i]}"/></g>`;
    }else{
      p+=`<g transform="rotate(${i*72})"><ellipse rx="4" ry="7" cy="-6.5" fill="none" stroke="${color}" stroke-width="1.2" opacity=".2"/></g>`;
    }
  }
  const center=on
    ?`<circle r="4.5" fill="#FFD700"/><circle r="2.5" fill="#FFA000" opacity=".5"/>`
    :`<circle r="4.5" fill="none" stroke="${color}" stroke-width="1.2" opacity=".2"/>`;
  // 茎和叶子（已获得才显示）
  const stem=on
    ?`<rect x="-1.5" y="5" width="3" height="5" rx="1.5" fill="#6BCB77"/><ellipse cx="4" cy="8" rx="3.5" ry="2" fill="#6BCB77" transform="rotate(-25,4,8)"/>`
    :'';
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 32 38"><g transform="translate(16,14)">${p}${center}</g>${stem}</svg>`;
}

function lighten(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return '#'+[r,g,b].map(v=>Math.min(255,v+50).toString(16).padStart(2,'0')).join('');
}

  const counts={self:0,care:0,explore:0,emotion:0};
  D.records.forEach(r=>{
    if(r.memberId===memberId&&r.type==='earn'&&counts.hasOwnProperty(r.dim))counts[r.dim]++;
  });
  return counts;
}

function getMaxStreak(memberId){
  const dateSet={};
  D.records.forEach(r=>{if(r.memberId===memberId&&r.type==='earn')dateSet[new Date(r.date).toISOString().slice(0,10)]=true});
  const dates=Object.keys(dateSet).sort();
  if(!dates.length)return 0;
  let max=1,cur=1;
  for(let i=1;i<dates.length;i++){
    const diff=(new Date(dates[i])-new Date(dates[i-1]))/864e5;
    if(Math.abs(diff-1)<0.1){cur++;if(cur>max)max=cur}else cur=1;
  }
  return max;
}

function getCurrentStreak(memberId){
  const dateSet={};
  D.records.forEach(r=>{if(r.memberId===memberId&&r.type==='earn')dateSet[new Date(r.date).toISOString().slice(0,10)]=true});
  const dates=Object.keys(dateSet).sort().reverse();
  if(!dates.length)return 0;
  const today=new Date().toISOString().slice(0,10);
  const yest=new Date(Date.now()-864e5).toISOString().slice(0,10);
  if(dates[0]!==today&&dates[0]!==yest)return 0;
  let streak=1;
  for(let i=1;i<dates.length;i++){
    const diff=(new Date(dates[i-1])-new Date(dates[i]))/864e5;
    if(Math.abs(diff-1)<0.1)streak++;else break;
  }
  return streak;
}

function giveFlower(memberId,content,dim){
  const member=D.members.find(c=>c.id===memberId);
  if(!member||!content.trim())return;
  member.flowers++;
  D.records.unshift({id:Date.now(),memberId,content:content.trim(),date:new Date().toISOString(),type:'earn',dim:dim||selDim||'self'});
  save();renderAll();animPetals();checkMedals(memberId);
  if(member.flowers>0&&member.flowers%D.need===0){
    setTimeout(()=>{animCelebrate();toast(member.name+' 集齐'+D.need+'朵红花，可以兑换礼物啦！','party')},350);
  }else{toast('给'+member.name+' +1 朵小红花','ok')}
}

// 扣花：扣 1 朵，记录 type='deduct'
function subtractFlower(memberId,content,dim){
  const member=D.members.find(c=>c.id===memberId);
  if(!member||!content.trim())return;
  if(member.flowers<=0){toast(member.name+' 的小红花已经清零，不能再扣啦','err');return}
  member.flowers--;
  D.records.unshift({id:Date.now(),memberId,content:content.trim(),date:new Date().toISOString(),type:'deduct',dim:dim||selDim||'self'});
  save();renderAll();
  toast('扣了 '+member.name+' 1 朵小红花','info');
}

function delRecord(rid){
  const r=D.records.find(x=>x.id===rid);if(!r)return;
  const member=D.members.find(c=>c.id===r.memberId);
  if(r.type==='earn'&&member)member.flowers=Math.max(0,member.flowers-1);
  if(r.type==='deduct'&&member)member.flowers+=1;
  if(r.type==='redeem'&&member)member.flowers+=(r.flowerCount||D.need);
  D.records=D.records.filter(x=>x.id!==rid);save();renderAll();toast('已撤销','info');
}

function undoLast(){
  const r=D.records.find(x=>x.memberId===curMember&&x.type==='earn');
  if(!r){toast('没有可撤销的记录','err');return}
  showConfirm('确定撤销这朵小红花吗？<br><span style="color:var(--muted);font-size:14px">"'+r.content+'"</span>',()=>delRecord(r.id));
}

function addWish(memberId,name){if(!name.trim())return;D.wishes.push({id:Date.now(),memberId,name:name.trim()});save();renderAll();toast('心愿已添加','ok')}
function delWish(wid){D.wishes=D.wishes.filter(w=>w.id!==wid);save();renderAll()}

function redeem(memberId,giftName){
  const member=D.members.find(c=>c.id===memberId);
  if(!member||member.flowers<D.need||!giftName.trim())return;
  member.flowers-=D.need;
  D.records.unshift({id:Date.now(),memberId,content:giftName.trim(),date:new Date().toISOString(),type:'redeem',flowerCount:D.need});
  const idx=D.wishes.findIndex(w=>w.memberId===memberId&&w.name===giftName.trim());
  if(idx>=0)D.wishes.splice(idx,1);
  save();renderAll();animCelebrate();toast(member.name+' 成功兑换了'+giftName.trim()+'！','party');
}

function addTag(name,dim,role){
  if(!name.trim())return;
  const n=name.trim();
  if(D.tags.some(t=>t.name===n)){toast('标签已存在','err');return}
  const mem=D.members.find(m=>m.id===curMember);
  const targetRole=role||mem?.role||'kid';
  D.tags.push({name:n,dim:dim||selDim||'self',role:targetRole});
  save();drawQTags();toast('标签已添加','ok')
}
function removeTag(name){D.tags=D.tags.filter(t=>t.name!==name);if(selTag===name)selTag='';save();drawQTags()}
function getCurRole(){return D.members.find(m=>m.id===curMember)?.role||'kid'}

function checkMedals(memberId){
  const counts=getDimCounts(memberId);
  const streak=getMaxStreak(memberId);
  const total=D.records.filter(r=>r.memberId===memberId&&r.type==='earn').length;
  const usedDims={};
  Object.keys(counts).forEach(k=>{if(counts[k]>0)usedDims[k]=true});

  const newly=[];
  MEDAL_DEFS.forEach(m=>{
    if(D.unlockedMedals[m.id])return;
    let progress=0;
    if(m.dim==='special'){
      if(m.id==='special_all')progress=Object.keys(usedDims).length;
      else if(m.id==='special_50')progress=total;
    }else if(m.dim==='persist'){
      progress=streak;
    }else{
      progress=counts[m.dim]||0;
    }
    if(progress>=m.need){
      D.unlockedMedals[m.id]=Date.now();
      newly.push(m);
    }
  });
  if(newly.length){
    save();
    // 依次展示勋章解锁弹窗
    newly.forEach((m,i)=>{
      setTimeout(()=>{
        document.getElementById('medalUnlockIcon').textContent=m.icon;
        document.getElementById('medalUnlockName').textContent=m.name;
        document.getElementById('medalUnlockDesc').textContent=m.desc;
        openM('mMedalUnlock');
        animPetals();
      },i*1500);
    });
  }
}

  Object.keys(counts).forEach(k=>{if(counts[k]>0)usedDims[k]=true});

  // 当前勋章进度摘要
  let h='<div class="mb-4 p-4 rounded-2xl" style="background:linear-gradient(135deg,rgba(255,179,71,.1),rgba(255,107,157,.1));border:2px solid var(--secondary)">';
  h+='<p class="text-base font-bold mb-2" style="color:var(--secondary)"><i class="fa-solid fa-medal mr-1"></i>当前进度</p>';
  h+='<div class="grid grid-cols-2 gap-2 text-sm">';
  Object.entries(DIMS).forEach(([k,d])=>{
    h+=`<div class="flex items-center gap-1.5"><i class="fa-solid ${d.icon}" style="color:${d.color}"></i>${d.name} <strong style="color:${d.color}">${counts[k]||0}</strong></div>`;
  });
  h+=`<div class="flex items-center gap-1.5"><i class="fa-solid fa-fire" style="color:#4FC3F7"></i>最长连续 <strong style="color:#4FC3F7">${streak}</strong> 天</div>`;
  h+=`<div class="flex items-center gap-1.5"><i class="fa-solid fa-heart" style="color:var(--primary)"></i>累计 <strong style="color:var(--primary)">${total}</strong> 朵</div>`;
  h+='</div></div>';

  // 按维度分组勋章
  Object.entries(DIMS).forEach(([dk,dim])=>{
    const medals=MEDAL_DEFS.filter(m=>m.dim===dk);
    if(!medals.length)return;
    h+=`<div class="mb-4"><div class="flex items-center gap-2 mb-2">`;
    h+=`<div class="w-7 h-7 rounded-lg flex items-center justify-center" style="background:${dim.color}20"><i class="fa-solid ${dim.icon} text-sm" style="color:${dim.color}"></i></div>`;
    h+=`<span class="text-base font-bold" style="color:${dim.color}">${dim.name}勋章</span>`;
    h+=`<span class="text-xs" style="color:var(--muted)">${dim.label}</span></div>`;
    h+='<div class="grid grid-cols-3 gap-2">';
    medals.forEach(m=>{
      const unlocked=!!D.unlockedMedals[m.id];
      const progress=dk==='persist'?streak:(counts[dk]||0);
      const pct=Math.min(1,progress/m.need);
      const bg=unlocked?'#FFD70010':'#f5f5f5';
      const bc=unlocked?'#FFD70040':'#e0e0e0';
      const ft=unlocked?'filter:none':'filter:grayscale(1) opacity(.4)';
      h+=`<div class="medal-card p-3 rounded-2xl text-center" style="background:${bg};border:2px solid ${bc};${unlocked?'':'opacity:.7;'}">`;
      h+=`<div class="text-4xl mb-1" style="${ft}">${m.icon}</div>`;
      h+=`<p class="text-xs font-bold mb-1" style="color:${unlocked?dim.color:'var(--muted)'}">${m.name}</p>`;
      if(unlocked){
        h+=`<p class="text-[10px]" style="color:var(--accent)"><i class="fa-solid fa-check"></i> 已获得</p>`;
      }else{
        h+=`<div class="w-full h-1.5 rounded-full mb-1" style="background:${dim.color}15"><div class="h-full rounded-full" style="width:${pct*100}%;background:${dim.color}"></div></div>`;
        h+=`<p class="text-[10px]" style="color:var(--muted)">${progress}/${m.need}</p>`;
      }
      h+='</div>';
    });
    h+='</div></div>';
  });

  // 特殊勋章
  const specialMedals=MEDAL_DEFS.filter(m=>m.dim==='special');
  h+='<div class="mb-4"><div class="flex items-center gap-2 mb-2">';
  h+=`<div class="w-7 h-7 rounded-lg flex items-center justify-center" style="background:#FFD70020"><i class="fa-solid fa-crown text-sm" style="color:#FFD700"></i></div>`;
  h+=`<span class="text-base font-bold" style="color:#FFD700">特别勋章</span></div><div class="grid grid-cols-2 gap-2">`;
  specialMedals.forEach(m=>{
    const unlocked=!!D.unlockedMedals[m.id];
    let progress=0;
    if(m.id==='special_all')progress=Object.keys(usedDims).length;
    else if(m.id==='special_50')progress=total;
    const pct=Math.min(1,progress/m.need);
    const bg=unlocked?'#FFD70010':'#f5f5f5';
    const bc=unlocked?'#FFD70040':'#e0e0e0';
    const ft=unlocked?'filter:none':'filter:grayscale(1) opacity(.4)';
    h+=`<div class="medal-card p-3 rounded-2xl text-center" style="background:${bg};border:2px solid ${bc};${unlocked?'':'opacity:.7;'}">`;
    h+=`<div class="text-4xl mb-1" style="${ft}">${m.icon}</div>`;
    h+=`<p class="text-xs font-bold mb-1" style="color:${unlocked?'#D4A000':'var(--muted)'}">${m.name}</p>`;
    if(unlocked){
      h+=`<p class="text-[10px]" style="color:var(--accent)"><i class="fa-solid fa-check"></i> 已获得</p>`;
    }else{
      h+=`<div class="w-full h-1.5 rounded-full mb-1" style="background:#FFD70015"><div class="h-full rounded-full" style="width:${pct*100}%;background:#FFD700"></div></div>`;
      h+=`<p class="text-[10px]" style="color:var(--muted)">${progress}/${m.need}</p>`;
    }
    h+='</div>';
  });
  h+='</div></div>';

  const unlockedCount=Object.keys(D.unlockedMedals).length;
  h+=`<div class="text-center py-3"><p class="text-sm" style="color:var(--muted)">已解锁 ${unlockedCount} / ${MEDAL_DEFS.length} 枚勋章</p></div>`;
  return h;
}

function openGive(){

function drawDimBtns(){

    const on=setSelDim===k;

function updateSetTagInput(){

// 设置页面：刷新标签列表（不重新打开整个模态框）
function drawSetTagsList(){
  const el=document.getElementById('setTagsList');
  if(!el)return;
  el.innerHTML=D.tags.map(t=>{
    const tn=typeof t==='string'?t:t.name;
    const di=DIMS[typeof t==='string'?'self':t.dim]||DIMS.self;
    return `<span class="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl text-sm" style="background:${di.color}15;border:2px solid ${di.color}30;color:${di.color}">

    </span>`;
  }).join('');
}

function drawQTags(){
  const el=document.getElementById('qTags');
  const mem=D.members.find(m=>m.id===curMember);
  const curRole=mem?.role||'kid';
  // 按维度过滤，再按角色过滤：带 role 的标签匹配当前角色才显示；不带 role 的共享标签所有角色都显示
  const visibleTags=D.tags.filter(t=>{
    const tdim=typeof t==='string'?'self':t.dim;
    if(tdim!==selDim)return false;
    if(typeof t==='object'&&t.role&&t.role!==curRole)return false;
    return true;
  });
  let h=visibleTags.map(t=>{
    const tname=typeof t==='string'?t:t.name;
    const dimInfo=DIMS[selDim]||DIMS.self;
    const on=selTag===tname;
    return `<span class="qtag inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-bold" style="border:2px solid ${on?dimInfo.color:'var(--border)'};background:${on?dimInfo.color+'15':'var(--card)'};color:${on?dimInfo.color:'var(--text)'}" onclick="pickTag('${esc(tname)}')">
      <i class="fa-solid ${dimInfo.icon} text-[10px]"></i> ${tname}<i class="fa-solid fa-xmark text-[10px] opacity-30 hover:opacity-100 ml-0.5" onclick="event.stopPropagation();removeTag('${esc(tname)}')"></i>
    </span>`;
  }).join('');
  h+=`<span class="qtag inline-flex items-center justify-center w-9 h-9 rounded-xl text-sm" style="border:2px dashed var(--border);color:var(--muted)" onclick="showAddTag()"><i class="fa-solid fa-plus"></i></span>`;
  el.innerHTML=h;
}

function pickTag(t){
  selTag=selTag===t?'':t;
  const found=D.tags.find(x=>(typeof x==='string'?x:x.name)===t);
  selDim=(found&&typeof found==='object')?(found.dim||'self'):'self';
  document.getElementById('giveInput').value=selTag;
  drawDimBtns();drawQTags();
}

// ==================== 数据备份与恢复 ====================
// 生成带时间戳的文件名
function backupFilename(){
  const d=new Date();
  const pad=n=>String(n).padStart(2,'0');
  return `朵朵红花-备份-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
}

// 判断当前是否在 iOS PWA 模式（iOS PWA 完全不支持下载 API）
function isIOSPWA(){
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
  const isStandalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  return isIOS&&isStandalone;
}

// 导出当前所有数据为 JSON 文件。
// 兼容策略：showSaveFilePicker（可指定文件名）→ <a download> + blob（普通浏览器）→ iOS PWA 弹窗显示文本
async function exportData(){
  try{
    const payload={
      _app:'朵朵红花',
      _version:'duoduo_honghua_v6',
      _exportedAt:new Date().toISOString(),
      data:D
    };
    const json=JSON.stringify(payload,null,2);
    const blob=new Blob([json],{type:'application/json'});
    const filename=backupFilename();

    // 方案 1：File System Access API（Chrome/Edge 桌面 86+），可让用户选位置+保留文件名
    if(window.showSaveFilePicker){
      try{
        const handle=await window.showSaveFilePicker({
          suggestedName:filename,
          types:[{description:'JSON 备份文件',accept:{'application/json':['.json']}}]
        });
        const w=await handle.createWritable();
        await w.write(blob);
        await w.close();
        toast('备份文件已保存','ok');
        return;
      }catch(e){
        if(e.name==='AbortError')return; // 用户取消
        console.warn('showSaveFilePicker 失败，回退：',e);
      }
    }

    // 方案 2：iOS PWA 完全不支持下载，弹窗显示文本让用户长按复制
    if(isIOSPWA()){
      showExportTextFallback(filename,json);
      return;
    }

    // 方案 3：传统 <a download> + blob URL（普通浏览器和 Android）
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=filename;
    a.style.display='none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast('已下载，请在下载列表确认文件名','ok');
  }catch(e){
    console.error(e);
    toast('导出失败：'+e.message,'err');
  }
}

// iOS PWA 兜底：弹出 modal 显示 JSON 文本，用户可长按全选复制
function showExportTextFallback(filename,json){
  const wrap=document.getElementById('confirmWrap');

    <div class="bg-white rounded-[24px] p-5 w-full max-w-md max-h-[80vh] flex flex-col" style="border:3px solid var(--primary-light)">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-xl" style="color:var(--primary)"><i class="fa-solid fa-file-export mr-1"></i>${filename}</h3>
        <button onclick="this.closest('.fixed').remove()" class="w-8 h-8 rounded-lg flex items-center justify-center hover:bg-gray-100"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <p class="text-xs mb-2" style="color:var(--muted)">iOS 不支持直接下载文件，请长按下方文字 → 复制。粘贴到「文件」App 或微信「文件传输助手」保存为 <code style="background:#f3f4f6;padding:1px 6px;border-radius:4px">${filename}</code></p>

      <div class="flex gap-2">

      </div>
    </div></div>`;
}

async function copyExportText(btn){

// 校验备份文件结构是否完整
function validateBackup(obj){
  if(!obj||typeof obj!=='object')return'文件内容不是有效的 JSON';
  if(obj._app!=='朵朵红花')return'不是朵朵红花的备份文件';
  if(obj._version!=='duoduo_honghua_v6')return`备份版本不匹配（当前版本 ${STORE_KEY}，文件版本 ${obj._version||'未知'}）`;
  const d=obj.data;
  if(!d||typeof d!=='object')return'备份缺少数据内容';
  if(!Array.isArray(d.members))return'备份缺少家庭成员数据';
  if(!Array.isArray(d.records))return'备份缺少红花记录数据';
  if(!Array.isArray(d.wishes))return'备份缺少心愿单数据';
  return null;
}

// 读取用户选择的备份文件并展示预览，二次确认后写入
function importData(input){
  const file=input.files&&input.files[0];
  input.value=''; // 重置以便能重复选同一个文件
  if(!file)return;
  const reader=new FileReader();
  reader.onerror=()=>toast('文件读取失败','err');
  reader.onload=ev=>{
    let parsed;
    try{parsed=JSON.parse(ev.target.result)}
    catch(e){toast('文件不是合法的 JSON：'+e.message,'err');return}
    const err=validateBackup(parsed);
    if(err){toast('备份无效：'+err,'err');return}
    showImportPreview(parsed.data,file.name,Math.round(file.size/1024));
  };
  reader.readAsText(file);
}

// 实际写入：复用 load() 的迁移逻辑后再 save()
function doImport(data){
  try{
    D=migrateData(data);
    // 重新执行一次迁移确保新版字段（如 unlockedMedals、tags）齐全
    if(typeof D.need!=='number')D.need=20;
    if(!D.tags||!D.tags.length)D.tags=buildTagsWithRoleDefaults(D.tags||[]);
    if(!D.unlockedMedals||typeof D.unlockedMedals!=='object')D.unlockedMedals={};
    if(!D.wishes)D.wishes=[];
    if(!D.records)D.records=[];
    curMember=D.members[0]?.id||1;
    save();
    renderAll();
    closeM('mSet');
    toast(`已导入 ${D.members.length} 位成员、${D.records.length} 条记录`,'ok');
  }catch(e){
    console.error(e);
    toast('导入失败：'+e.message,'err');
  }
}

// 添加新成员
function addMember(){
  const nid=D.members.reduce((max,m)=>Math.max(max,m.id||0),0)+1;
  const color=MEMBER_COLORS.find(c=>!D.members.some(m=>(m.color||'').toLowerCase()===c.toLowerCase()))||'#5EEAD4';
  const emojiOptions=['😊','🌟','🌈','🦄','🐻','🐼','🦊','🐯','🐰','🐶','🐱'];
  const emoji=emojiOptions[nid%emojiOptions.length];
  const usedNames=new Set(D.members.map(m=>m.name));
  let defaultName='家人';
  for(let i=1;i<=20;i++){
    const cand=`家人${i}`;
    if(!usedNames.has(cand)){defaultName=cand;break}
  }
  D.members.push({id:nid,name:defaultName,flowers:0,color,emoji,avatar:'',role:'other'});
  curMember=nid;
  save();renderAll();openSettings();
  toast('已添加新成员','ok');
  setTimeout(()=>{
    const inputs=document.querySelectorAll('#setBody input[type="text"]');
    const lastNameInput=inputs[inputs.length-1];
    if(lastNameInput&&lastNameInput.maxLength===6)lastNameInput.focus();
  },100);
}

// 删除某个成员
function askRemoveMember(i){
  const m=D.members[i];
  if(!m)return;
  const recCount=D.records.filter(r=>r.memberId===m.id).length;
  const wishCount=D.wishes.filter(w=>w.memberId===m.id).length;
  let msg=`确定删除「${m.name}」吗？<br><span style="color:var(--muted);font-size:14px">该成员的红花和心愿都会被清除</span>`;
  if(recCount+wishCount>0){
    msg+=`<br><span style="color:#E85D5D;font-size:13px">将一并删除 ${recCount} 条记录和 ${wishCount} 条心愿</span>`;
  }
  showConfirm(msg,()=>{
    D.records=D.records.filter(r=>r.memberId!==m.id);
    D.wishes=D.wishes.filter(w=>w.memberId!==m.id);
    D.members.splice(i,1);
    // 删除勋章记录里与该成员无关的部分（这里勋章是全局共享 key，可保留不动）
    if(curMember===m.id){
      curMember=D.members[0]?.id;
    }
    save();renderAll();openSettings();toast('成员已删除','info');
  });
}

// 选择并压缩图片作为头像
function pickAvatar(idx,input){
  const file=input.files&&input.files[0];
  if(!file)return;
  if(!file.type.startsWith('image/')){toast('请选择图片文件','err');input.value='';return}
  if(file.size>10*1024*1024){toast('图片不能超过10MB','err');input.value='';return}
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=256;
      let w=img.width,h=img.height;
      if(w>h&&w>MAX){h=h*MAX/w;w=MAX}
      else if(h>MAX){w=w*MAX/h;h=MAX}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const ctx=c.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      try{
        D.members[idx].avatar=c.toDataURL('image/jpeg',0.82);
        save();renderAll();openSettings();
        toast('头像已更新','ok');
      }catch(err){
        toast('图片保存失败，请换一张试试','err');
      }
    };
    img.onerror=()=>toast('图片读取失败','err');
    img.src=e.target.result;
  };
  reader.onerror=()=>toast('文件读取失败','err');
  reader.readAsDataURL(file);
  input.value='';
}

// ==================== 动画 ====================
function animPetals(){
  const cols=['#FF6B9D','#FF8DB5','#FFB347','#FFD180','#6BCB77','#4FC3F7'];
  for(let i=0;i<12;i++){setTimeout(()=>{
    const p=document.createElement('div');p.className='petal';
    Object.assign(p.style,{left:(Math.random()*80+10)+'vw',top:'-20px',
      width:(Math.random()*16+10)+'px',height:(Math.random()*16+10)+'px',
      background:cols[~~(Math.random()*cols.length)],borderRadius:'50% 0 50% 0',
      animationDuration:(Math.random()*2+2)+'s'});
    document.body.appendChild(p);setTimeout(()=>p.remove(),4500);
  },i*70)}
}

function animCelebrate(){
  const cols=['#FF6B9D','#FFB347','#6BCB77','#FFD180','#4FC3F7','#9C6ADE','#FF8DB5'];
  for(let i=0;i<45;i++){setTimeout(()=>{
    const c=document.createElement('div');c.className='cft';
    Object.assign(c.style,{left:(Math.random()*100)+'vw',
      width:(Math.random()*10+5)+'px',height:(Math.random()*10+5)+'px',
      background:cols[~~(Math.random()*cols.length)],borderRadius:Math.random()>.5?'50%':'3px',
      animationDuration:(Math.random()*2+2)+'s',animationDelay:(Math.random()*.5)+'s'});
    document.body.appendChild(c);setTimeout(()=>c.remove(),5000);
  },i*35)}
}

// ==================== Toast ====================
function toast(msg,type){
  const ct=document.getElementById('toasts');
  const t=document.createElement('div');
  const bg={ok:'var(--primary)',err:'#EF4444',info:'#4A3728',party:'var(--secondary)'}[type]||'#4A3728';
  const ic={ok:'fa-heart',err:'fa-circle-exclamation',info:'fa-circle-info',party:'fa-star'}[type]||'fa-circle-info';
  t.className='toast-in flex items-center gap-2 px-5 py-3 rounded-2xl text-white text-base shadow-lg whitespace-nowrap';
  t.style.background=bg;t.innerHTML=`<i class="fa-solid ${ic}"></i>${msg}`;
  ct.appendChild(t);setTimeout(()=>t.remove(),2800);
}

function esc(s){return s.replace(/'/g,"\\'").replace(/"/g,'&quot;')}
